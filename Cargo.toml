[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/jliocsar/traitor"

[workspace.dependencies]
semver = "1.0.28"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
snafu = "0.9.2"
traitor-ai-typesafe = { path = "crates/traitor-ai-typesafe" }
traitor-core = { path = "crates/traitor-core" }

[profile.release]
lto = true
codegen-units = 1
strip = true

# begone-slop-rs's preset (`cargo bs init`). `cargo bs` fails if these drift looser.
[workspace.lints.rust]
unsafe_code = "deny"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
arbitrary_source_item_ordering = "warn"
assertions_on_result_states = "warn"
cfg_not_test = "warn"
dbg_macro = "warn"
exit = "warn"
expect_used = "warn"
let_underscore_must_use = "warn"
map_err_ignore = "warn"
min_ident_chars = "warn"
mod_module_files = "warn"
needless_raw_string_hashes = "warn"
needless_raw_strings = "warn"
option_if_let_else = "warn"
panic = "warn"
panic_in_result_fn = "warn"
precedence_bits = "warn"
todo = "warn"
undocumented_unsafe_blocks = "warn"
unimplemented = "warn"
unreachable = "warn"
unused_result_ok = "warn"
unwrap_in_result = "warn"
unwrap_used = "warn"
