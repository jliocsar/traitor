[package]
name = "traitor-cli"
description = "Checks changed code and docs against a repo's traits."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "traitor"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
semver.workspace = true
serde.workspace = true
serde_json.workspace = true
snafu.workspace = true
tokio = { version = "1.54.1", features = ["rt", "macros"] }
traitor-ai-typesafe.workspace = true
traitor-core.workspace = true

[dev-dependencies]
# Only the test that keeps schema/check-report.schema.json current generates the schema.
schemars = "1.2.3"

[lints]
workspace = true
