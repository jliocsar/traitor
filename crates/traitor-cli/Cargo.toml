[package]
name = "traitor-cli"
description = "Checks changed code and docs against a repo's traits."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "traitor"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
semver = "1.0.28"
snafu = "0.9.2"
tokio = { version = "1.54.1", features = ["rt", "macros"] }
traitor-ai-typesafe = { version = "0.0.0", path = "../traitor-ai-typesafe" }
traitor-core = { version = "0.0.0", path = "../traitor-core" }
