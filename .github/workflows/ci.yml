name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
            builder: zigbuild
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-latest
            builder: zigbuild
          - target: x86_64-apple-darwin
            runner: macos-latest
            builder: build
          - target: aarch64-apple-darwin
            runner: macos-latest
            builder: build
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            builder: build
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - run: rustup target add ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - if: matrix.builder == 'zigbuild'
        uses: mlugg/setup-zig@v2
      - if: matrix.builder == 'zigbuild'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild
      - run: cargo ${{ matrix.builder }} --release --locked --target ${{ matrix.target }} -p traitor-cli
      - uses: actions/upload-artifact@v5
        with:
          name: traitor-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/traitor
            target/${{ matrix.target }}/release/traitor.exe
          if-no-files-found: error
