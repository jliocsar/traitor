name: ci

# docs-only changes can't break the build, so they skip CI
on:
  push:
    branches: [main]
    paths-ignore: &docs
      - README.md
      - CONTEXT.md
      - LICENSE
      - docs/**
      - .github/assets/**
  pull_request:
    paths-ignore: *docs

jobs:
  check:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      # begone-slop-rs's syntax and pattern rules. Clippy above already enforces its lints.
      - uses: taiki-e/install-action@v2
        with:
          tool: ast-grep@0.45.3
      - run: cargo install --locked --git https://github.com/jliocsar/begone-slop-rs --rev 3561cd530cf93f188f1038f1a1a8626d26e0683a cargo-bs
      - run: cargo bs

  build:
    uses: ./.github/workflows/build.yml
