name: build

on:
  workflow_call:
    inputs:
      version:
        description: The version to build, such as 1.2.3. Empty builds the committed 0.0.0.
        type: string
        default: ""

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-26.04
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-26.04-arm
          - target: x86_64-apple-darwin
            runner: macos-26
          - target: aarch64-apple-darwin
            runner: macos-26
          - target: x86_64-pc-windows-msvc
            runner: windows-2025
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - if: inputs.version != ''
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          sed -i.bak "s/^version = \"0.0.0\"$/version = \"$VERSION\"/" Cargo.toml
          rm Cargo.toml.bak
          grep -qx "version = \"$VERSION\"" Cargo.toml
          cargo update --workspace
      - run: rustup target add ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes musl-tools
      - run: cargo build --release --locked --target ${{ matrix.target }} -p traitor-cli
      - if: runner.os == 'Linux'
        run: file target/${{ matrix.target }}/release/traitor | grep --quiet 'static'
      - uses: actions/upload-artifact@v7
        with:
          name: traitor-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/traitor
            target/${{ matrix.target }}/release/traitor.exe
          if-no-files-found: error
