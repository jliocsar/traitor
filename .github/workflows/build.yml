name: build

on:
  workflow_call:
    inputs:
      version:
        description: The version to build, such as 1.2.3. Empty builds the committed 0.0.0.
        type: string
        default: ""

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
            builder: zigbuild
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-latest
            builder: zigbuild
          - target: x86_64-apple-darwin
            runner: macos-latest
            builder: build
          - target: aarch64-apple-darwin
            runner: macos-latest
            builder: build
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            builder: build
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - if: inputs.version != ''
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          sed -i.bak "s/^version = \"0.0.0\"$/version = \"$VERSION\"/" Cargo.toml
          rm Cargo.toml.bak
          grep -qx "version = \"$VERSION\"" Cargo.toml
          cargo update --workspace
      - run: rustup target add ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - if: matrix.builder == 'zigbuild'
        uses: mlugg/setup-zig@v2
      - if: matrix.builder == 'zigbuild'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild
      - run: cargo ${{ matrix.builder }} --release --locked --target ${{ matrix.target }} -p traitor-cli
      - uses: actions/upload-artifact@v5
        with:
          name: traitor-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/traitor
            target/${{ matrix.target }}/release/traitor.exe
          if-no-files-found: error
